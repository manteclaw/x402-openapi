openapi: 3.0.3
info:
  title: Manteclaw x402 API Service
  description: 'x402 pay-per-call API on Base. 200 endpoints: live gas prices, token prices and security,
    wallet analytics, DEX pairs and Uniswap V3 pools, blocks and transactions, NFTs, DeFi yields and TVL,
    lending markets, stablecoins, Chainlink oracles, governance, memecoins, prediction markets, ENS, and
    utilities — all priced in USDC per call.


    Pay-per-call API on Base: 199 paid endpoints priced in USDC per call via x402 v2, plus a free /health
    probe. Unpaid calls return HTTP 402 with the payment terms in the `payment-required` header; each
    paid operation documents its exact price in `x-payment-info`. Data comes from live sources (Base RPC,
    Dexscreener, DeFiLlama, CoinGecko, ENS, Alternative.me) — no API keys, no subscriptions.'
  version: 5.0.0
  contact:
    name: Manteclaw
    url: https://github.com/manteclaw
servers:
- url: https://manteclaw-x402.fly.dev
  description: Production (Base mainnet, USDC)
externalDocs:
  description: Service repository and how-to-call guide
  url: https://github.com/manteclaw/manteclaw-x402
x-x402:
  facilitator: https://facilitator.payai.network
  network: eip155:8453
  asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
  payTo: '0xea0aad6dfa33d6ea4aec842c24d2015e3a4b3175'
tags:
- name: analytics
  description: Analytics
- name: chain
  description: Chain, blocks, transactions and gas
- name: defi
  description: DeFi yields, TVL and protocols
- name: dex
