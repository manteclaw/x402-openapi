paths:
  /chain/address/{address}/code:
    get:
      operationId: chainAddressCode
      summary: Chain Address Code
      description: Bytecode for a Base address, with size and hash. $0.005 USDC per call.
      tags:
      - chain
      responses:
        '200':
          description: Successful response (JSON).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad request — invalid parameter (e.g. malformed address).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests — an upstream data source rate-limited the call (e.g. CoinGecko
            free tier).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Upstream error — the service returns a clean error, never fabricated data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment Required — this endpoint is pay-per-call. The response carries the payment
            terms in the base64-encoded `payment-required` header (x402 v2). Sign an EIP-3009 transferWithAuthorization
            for the amount in `x-payment-info` and retry with the signature in the `X-PAYMENT` header.
            Payment signatures are off-chain; no ETH is needed to call.
          headers:
            payment-required:
              description: Base64-encoded x402 v2 payment terms.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: address
        in: path
        required: true
        description: An address on Base (0x-prefixed, 40 hex characters) — a token contract or a wallet,
          depending on the endpoint.
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
      x-payment-info:
        scheme: exact
        network: eip155:8453
        asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
        amount: '5000'
        payTo: '0xea0aad6dfa33d6ea4aec842c24d2015e3a4b3175'
        maxTimeoutSeconds: 300
        priceUsdc: '0.005'
