- name: gas
  description: Gas prices
- name: governance
  description: Governance and protocol votes
- name: lending
  description: Lending markets, rates and positions
- name: memes
  description: Memecoins and trending tokens
- name: naming
  description: Naming (ENS)
- name: nft
  description: NFTs
- name: oracles
